[workspace]
resolver = "2"
members = ["crates/alpm-rs", "crates/pacman-rs", "crates/coreutils-rs", "crates/makepkg-rs", "crates/archrs-cron", "crates/privtools-rs", "crates/archrs-install"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
