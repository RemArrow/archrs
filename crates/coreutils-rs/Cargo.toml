[package]
name = "coreutils-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coreutils-rs"
path = "src/main.rs"

[build-dependencies]
cargo_metadata = "0.19"

[dependencies]
uucore = "0.12"
findutils = "0.10"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
minus = { version = "5", features = ["static_output", "search"] }
brush-shell = "0.4"
uu_ls = "0.12"
